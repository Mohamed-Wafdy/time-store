<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded dark background badge -->
  <rect width="32" height="32" rx="8" fill="#18181b"/>
  
  <!-- Watch strap top -->
  <rect x="12" y="2" width="8" height="5" rx="1" fill="#ca9a44" opacity="0.9"/>
  <!-- Watch strap bottom -->
  <rect x="12" y="25" width="8" height="5" rx="1" fill="#ca9a44" opacity="0.9"/>
  
  <!-- Watch case / bezel -->
  <circle cx="16" cy="16" r="9.5" stroke="#ca9a44" stroke-width="2" fill="#232326"/>
  <!-- Watch dial inner ring -->
  <circle cx="16" cy="16" r="7.5" stroke="#ca9a44" stroke-width="0.5" stroke-dasharray="1 1.5" opacity="0.6"/>
  
  <!-- Hour markers -->
  <circle cx="16" cy="9.5" r="0.8" fill="#ca9a44"/>
  <circle cx="22.5" cy="16" r="0.8" fill="#ca9a44"/>
  <circle cx="16" cy="22.5" r="0.8" fill="#ca9a44"/>
  <circle cx="9.5" cy="16" r="0.8" fill="#ca9a44"/>
  
  <!-- Watch hands -->
  <line x1="16" y1="16" x2="12.5" y2="12.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="20" y2="11.5" stroke="#ca9a44" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center pin -->
  <circle cx="16" cy="16" r="1.3" fill="#ca9a44"/>
  <circle cx="16" cy="16" r="0.6" fill="#18181b"/>
</svg>

